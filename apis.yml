name: LyondellBasell
description: |-
  LyondellBasell Industries N.V. (NYSE: LYB) is one of the world's largest
  producers of polymers and plastic resins, including polyethylene, polypropylene,
  and specialty polyolefins such as Catalloy and Polybutene-1. The company also
  produces chemicals, fuels, polyolefin process technology, and advanced polymer
  solutions, and operates a Circular & Low Carbon Solutions (CLCS) business
  marketing CirculenRecover and CirculenRenew recycled and renewable polymers.

  LyondellBasell has no public developer program, no API documentation, and no
  source code published in its (empty) GitHub organization. In January 2025 the
  company began the permanent closure of its Houston Refining facility — the
  263,776 bpd, full-conversion plant that was the first refinery on the Houston
  Ship Channel when it opened in 1918 — eliminating more than 400 jobs and
  exiting the refining business entirely. Profiled as a Tier 3 industrial /
  no-APIs provider for portfolio completeness.
